<div class="bg-slate-800 text-white w-64 h-screen sticky top-0 p-4 flex flex-col justify-between overflow-y-auto">
  <div>
    <h2 class="text-xl font-bold mb-4 tracking-tight">Inventario</h2>
    <ul class="space-y-1">
      @for (item of menu; track item.ruta) {
        <li>
          <a
            [routerLink]="item.ruta"
            routerLinkActive="bg-indigo-600 text-white"
            class="block px-3 py-2 rounded-xl text-sm md:text-base text-slate-200 hover:bg-slate-700 hover:text-white transition-colors"
          >
            {{ item.nombre }}
          </a>
        </li>
      }
    </ul>
  </div>
  <div class="pt-4 border-t border-slate-700">
    <button
      (click)="logout()"
      class="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-sm md:text-base text-red-300 hover:bg-red-600/20 hover:text-red-200 transition-colors"
    >

      Cerrar Sesión
    </button>
  </div>
</div>
