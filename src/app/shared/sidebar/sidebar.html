<div class="bg-slate-800 text-white p-3 md:min-h-screen">
  <h2 class="text-xl font-bold mb-2 md:mb-4">Inventario</h2>
  <ul class="flex flex-wrap gap-1 md:block">
    @for (item of menu; track item.ruta) {
      <li class="md:mb-2">
        <a [routerLink]="item.ruta" class="block p-2 rounded-xl text-sm md:text-base hover:bg-slate-600">{{ item.nombre }}</a>
      </li>
    }
  </ul>
</div>
